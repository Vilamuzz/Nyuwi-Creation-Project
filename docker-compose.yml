services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyuwi-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./docker/php/pool.conf:/usr/local/etc/php-fpm.d/zz-pool.conf:ro
    networks: [nyuwi-network]
    depends_on: [db, redis]
    deploy:
      resources:
        limits: { cpus: '2', memory: 2G }

  webserver:
    image: nginx:alpine
    container_name: nyuwi-webserver
    restart: unless-stopped
    ports: ["8080:80"]
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    networks: [nyuwi-network]
    depends_on: [app]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

  db:
    image: mysql:8.0
    container_name: nyuwi-db
    restart: unless-stopped
    command: >
      --innodb-buffer-pool-size=512M
      --max-connections=200
    environment:
      MYSQL_DATABASE: nyuwicreation
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: password
      MYSQL_USER: nyuwi
    volumes:
      - db_data:/var/lib/mysql
    ports: ["127.0.0.1:3306:3306"]
    networks: [nyuwi-network]
    deploy:
      resources:
        limits: { cpus: '1', memory: 1G }

  redis:
    image: redis:alpine
    container_name: nyuwi-redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    networks: [nyuwi-network]
    deploy:
      resources:
        limits: { cpus: '0.5', memory: 256M }

networks:
  nyuwi-network:
    driver: bridge

volumes:
  db_data:
